<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body>
    <div class="w-full h-screen relative">
        <header class="w-full h-[90px] bg-[#f2f4f2] flex border-b border-[#89918c]">
            <div class="w-[20%] h-full flex items-center justify-center gap-[10px]">
                <div class="w-[40px] h-[40px] bg-[#0b6e4f] rounded-[5px] 
                flex items-center justify-center text-white font-bold font-sans font-size-lg">
                    A

                </div>
                <div class="font-bold text-[30px]">
                    Axel
                </div>

            </div>
            <div class="w-[60%] h-full">
                <nav class="w-full h-full flex items-center justify-center
                gap-[40px] text-[20px] text-[#89918c]">
                    <a href="" class="font-bold text-black">Home</a>
                    <a href="">Services</a>
                    <a href="">Work</a>
                    <a href="">About</a>
                    <a href="">Contact</a>

                </nav>


            </div>
            <div class="w-[20%] h-full flex items-center justify-center gap-[20px]">
                <button class="w-[150px] h-[50px] rounded-md border-[1px] border-[#89918c] cursor-pointer">
                    Client Login
                </button>
                <button class="w-[150px] h-[50px] rounded-md border-[1px] 
                border-[#0b6e4f] bg-[#0b6e4f] text-white 
                cursor-pointer hover:bg-white hover:text-[#0b6e4f] transition-all duration-300 ease">
                    Book a Call
                </button>

            </div>

        </header>
        <main class="w-full h-full absolute bg-[#f2f4f2] top-[0px] z-[-1] pt-[180px] pl-[90px] pr-[90px]">
            <section class="w-full h-auto flex border-b border-[#89918c] pb-[80px]">
                <div class="w-[60%] h-full">
                    <p class="text-[#0b6e4f] text-[20px] 
                    font-mono">- MANAGEMENT & STRATEGY CONSULTING</p>
                    <h1 class="font-bold text-[80px] leading-[1] w-[80%]">The few decisions that <span
                            class="text-[#0b6e4f]">define</span> a decade</h1>

                </div>
                <div class="w-[40%] h-full ">
                    <p class="text-[25px] text-[#89918c]">Halvorn advises leaders through growth, transformation, and
                        moments that dont come twice - with the rigor of bank and the pace of a founder</p>
                    <div class="w-full flex gap-[20px] mt-[20px]">
                        <button class="w-[150px] h-[50px] rounded-md border-[1px] 
                border-[#0b6e4f] bg-[#0b6e4f] text-white 
                cursor-pointer hover:bg-white hover:text-[#0b6e4f] transition-all duration-300 ease">
                            Book a Call
                        </button>
                        <button class="w-[150px] h-[50px] rounded-md border-[1px] border-[#89918c] cursor-pointer">
                            See our work
                        </button>



                    </div>


                </div>
            </section>

        </main>

    </div>

</html>
